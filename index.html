<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELF SO Web Analyzer</title>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.5/full/pyodide.js"></script>

<style>
:root {
  --bg: #080c12;
  --panel: #111923;
  --panel2: #182432;
  --border: #2b3b4c;
  --text: #eaf1f7;
  --muted: #93a2b2;
  --green: #37dc87;
  --blue: #55adff;
  --yellow: #e8c15d;
  --red: #ff6262;
  --orange: #ff9e4d;
  --purple: #bf88ff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Tahoma, Arial, sans-serif;
}

.app {
  max-width: 1800px;
  margin: auto;
  padding: 12px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 17px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: linear-gradient(120deg, #122130, #0e171f);
}

h1 {
  margin: 0;
  color: var(--green);
  font-size: 23px;
}

.subtitle {
  margin-top: 7px;
  color: var(--muted);
  font-size: 12px;
}

.file-button,
button {
  display: inline-block;
  padding: 10px 13px;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font: inherit;
}

.file-button {
  background: var(--green);
  color: #06110a;
  font-weight: bold;
}

.file-button input {
  display: none;
}

button {
  background: var(--panel2);
  color: var(--text);
}

button:hover,
button.active {
  background: var(--green);
  color: #06110a;
}

.status {
  min-height: 24px;
  margin: 10px 2px;
  color: var(--yellow);
  overflow-wrap: anywhere;
}

.notice {
  margin: 10px 0;
  padding: 11px;
  border: 1px solid #695828;
  border-radius: 8px;
  background: #282313;
  color: #f3db8a;
  font-size: 12px;
  line-height: 1.7;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

#search {
  flex: 1;
  min-width: 210px;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: 8px;
  outline: none;
  background: var(--panel);
  color: var(--text);
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}

.card {
  padding: 12px 8px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel);
  text-align: center;
}

.card-label {
  color: var(--muted);
  font-size: 11px;
}

.card-value {
  margin-top: 7px;
  color: var(--green);
  font-size: 18px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.layout {
  display: grid;
  grid-template-columns: 330px minmax(350px, 1fr) 430px;
  gap: 10px;
}

.panel {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--panel);
}

.panel-header {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 11px;
  border-bottom: 1px solid var(--border);
  background: var(--panel2);
}

.panel-title {
  color: var(--blue);
  font-weight: bold;
}

.list {
  max-height: 710px;
  overflow: auto;
}

.item {
  padding: 10px;
  border-bottom: 1px solid #243240;
  cursor: pointer;
  direction: ltr;
  text-align: left;
  overflow-wrap: anywhere;
}

.item:hover,
.item.selected {
  border-right: 3px solid var(--green);
  background: #203548;
}

.item-name {
  font-family: Consolas, monospace;
  font-size: 12px;
}

.item-sub {
  margin-top: 5px;
  color: var(--muted);
  font-family: Consolas, monospace;
  font-size: 11px;
}

.badge {
  display: inline-block;
  margin: 2px;
  padding: 3px 7px;
  border-radius: 99px;
  font-size: 10px;
  font-weight: bold;
}

.green {
  background: var(--green);
  color: #06110a;
}

.blue {
  background: var(--blue);
  color: #06110a;
}

.yellow {
  background: var(--yellow);
  color: #1d1605;
}

.red {
  background: var(--red);
  color: #270606;
}

.orange {
  background: var(--orange);
  color: #2a1605;
}

.purple {
  background: var(--purple);
  color: #190b2c;
}

.empty {
  padding: 30px 12px;
  color: var(--muted);
  text-align: center;
}

.graph {
  min-height: 550px;
  max-height: 710px;
  padding: 12px;
  overflow: auto;
  background: radial-gradient(circle, #182b3d, #0b1219 75%);
}

.graph-title {
  margin-bottom: 12px;
  direction: ltr;
  text-align: left;
  color: var(--yellow);
  font-family: Consolas, monospace;
}

.graph-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 12px 0;
  direction: ltr;
}

.node {
  max-width: 270px;
  padding: 9px;
  border: 1px solid var(--blue);
  border-radius: 8px;
  background: #17354a;
  color: var(--text);
  font-family: Consolas, monospace;
  font-size: 11px;
  text-align: center;
  overflow-wrap: anywhere;
}

.node.main {
  border-color: var(--green);
  background: #16402b;
}

.node.caller {
  border-color: var(--purple);
  background: #3e2648;
}

.arrow {
  color: var(--yellow);
  font-size: 20px;
}

.details {
  padding: 12px;
  line-height: 1.7;
}

.section {
  margin-bottom: 16px;
}

.section-title {
  margin-bottom: 7px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--border);
  color: var(--yellow);
  font-weight: bold;
}

.kv {
  display: grid;
  grid-template-columns: 125px 1fr;
  gap: 5px;
}

.kv b {
  color: var(--muted);
}

code,
pre,
.mono {
  direction: ltr;
  text-align: left;
  font-family: Consolas, monospace;
}

code {
  color: var(--yellow);
  overflow-wrap: anywhere;
}

pre {
  max-height: 330px;
  margin: 0;
  padding: 10px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #090f15;
  color: #bfd6e7;
  font-size: 11px;
}

.detail-list {
  max-height: 260px;
  overflow: auto;
}

.detail-line {
  padding: 5px 7px;
  border-bottom: 1px solid #243240;
  direction: ltr;
  text-align: left;
  font-family: Consolas, monospace;
  font-size: 11px;
  overflow-wrap: anywhere;
}

.progress {
  width: 100%;
  height: 9px;
  margin-top: 7px;
  overflow: hidden;
  border-radius: 9px;
  background: #263442;
}

.progress span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--green), var(--yellow), var(--red));
}

@media(max-width:1200px) {
  .layout {
    grid-template-columns: 310px 1fr;
  }

  .right-panel {
    grid-column: 1 / -1;
  }
}

@media(max-width:720px) {
  .app {
    padding: 7px;
  }

  .layout {
    display: block;
  }

  .panel {
    margin-bottom: 10px;
  }

  .graph {
    min-height: 430px;
  }

  .kv {
    grid-template-columns: 100px 1fr;
  }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div>
    <h1>ELF / SO Analyzer</h1>
    <div class="subtitle">
      تحليل المكتبة مباشرة داخل المتصفح
    </div>
  </div>

  <label class="file-button">
    اختيار ملف SO / ELF
    <input id="elfFile" type="file" accept=".so,.elf,application/octet-stream">
  </label>
</header>

<div id="notice" class="notice">
  جاري تجهيز Python داخل المتصفح...
</div>

<div id="status" class="status">
  انتظر تحميل المحلل.
</div>

<div class="toolbar">
  <input id="search" placeholder="ابحث عن دالة أو RVA أو API أو String">

  <button class="mode active" data-mode="protection">
    الحماية
  </button>

  <button class="mode" data-mode="crash">
    الكراش
  </button>

  <button class="mode" data-mode="related">
    Related
  </button>

  <button class="mode" data-mode="all">
    كل الدوال
  </button>

  <button id="clear">
    مسح التحديد
  </button>
</div>

<div class="cards">
  <div class="card">
    <div class="card-label">الملف</div>
    <div id="fileName" class="card-value">-</div>
  </div>

  <div class="card">
    <div class="card-label">المعمارية</div>
    <div id="arch" class="card-value">-</div>
  </div>

  <div class="card">
    <div class="card-label">كل الدوال</div>
    <div id="total" class="card-value">0</div>
  </div>

  <div class="card">
    <div class="card-label">الحماية</div>
    <div id="protection" class="card-value">0</div>
  </div>

  <div class="card">
    <div class="card-label">الكراش</div>
    <div id="crash" class="card-value">0</div>
  </div>

  <div class="card">
    <div class="card-label">Related</div>
    <div id="related" class="card-value">0</div>
  </div>
</div>

<div class="layout">

<section class="panel">
  <div class="panel-header">
    <span id="listTitle" class="panel-title">الحماية</span>
    <span id="listCount" class="badge green">0</span>
  </div>

  <div id="list" class="list">
    <div class="empty">لم يتم تحليل أي ملف.</div>
  </div>
</section>

<section class="panel">
  <div class="panel-header">
    <span class="panel-title">العلاقات</span>
    <span class="badge yellow">Callers / Callees</span>
  </div>

  <div id="graph" class="graph">
    <div class="empty">اختر دالة لعرض العلاقات.</div>
  </div>
</section>

<section class="panel right-panel">
  <div class="panel-header">
    <span class="panel-title">التفاصيل</span>
  </div>

  <div id="details">
    <div class="empty">لا توجد تفاصيل.</div>
  </div>
</section>

</div>
</div>

<script>
"use strict";

let pyodide = null;
let report = null;
let currentMode = "protection";
let selected = null;
let visibleItems = [];

const $ = id => document.getElementById(id);

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function safe(value, fallback = "-") {
  return value === null ||
    value === undefined ||
    value === ""
      ? fallback
      : String(value);
}

function hex(value) {
  const number = Number(value);

  if (!Number.isFinite(number)) {
    return safe(value);
  }

  return "0x" +
    number.toString(16).toUpperCase().padStart(6, "0");
}

function setStatus(text, error = false) {
  $("status").textContent = text;
  $("status").style.color = error
    ? "var(--red)"
    : "var(--yellow)";
}

function tierClass(tier) {
  const value = String(tier || "").toLowerCase();

  if (value === "critical") return "red";
  if (value === "high") return "orange";
  if (value === "medium") return "yellow";
  if (value === "low") return "blue";

  return "purple";
}

function normalizeReport(data, fileName) {
  if (!data || typeof data !== "object") {
    throw new Error("نتيجة التحليل ليست JSON صحيحة.");
  }

  return {
    ...data,

    file: data.file || fileName,

    protection: Array.isArray(data.protection)
      ? data.protection
      : [],

    fix_crash: Array.isArray(data.fix_crash)
      ? data.fix_crash
      : [],

    related: Array.isArray(data.related)
      ? data.related
      : [],

    all_functions: Array.isArray(data.all_functions)
      ? data.all_functions
      : (
        Array.isArray(data.functions)
          ? data.functions
          : []
      )
  };
}

function reportItems() {
  if (!report) return [];

  if (currentMode === "crash") {
    return report.fix_crash;
  }

  if (currentMode === "related") {
    return report.related;
  }

  if (currentMode === "all") {
    return report.all_functions;
  }

  return report.protection;
}

function score(item) {
  return Number(
    item.confidence ??
    item.protection_confidence ??
    item.crash_confidence ??
    item.score ??
    item.crash_score ??
    0
  );
}

function searchable(item) {
  return [
    item.name,
    item.rva,
    item.rva_fmt,
    item.tier,
    item.tier_ar,
    item.primary_category,
    item.related_to,
    item.confidence_reasons,
    ...(item.imports_called || []),
    ...(item.strings_ref || []),
    ...(item.decoded_strings || [])
  ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();
}

function updateCards() {
  if (!report) return;

  $("fileName").textContent =
    String(report.file || "-").split("/").pop();

  $("arch").textContent =
    report.arch || report.architecture || "-";

  $("total").textContent =
    report.total ??
    report.all_functions.length;

  $("protection").textContent =
    report.protection.length;

  $("crash").textContent =
    report.fix_crash.length;

  $("related").textContent =
    report.related.length;
}

function renderList() {
  const search = $("search").value.trim().toLowerCase();

  let items = reportItems();

  if (search) {
    items = items.filter(item =>
      searchable(item).includes(search)
    );
  }

  visibleItems = items;

  const titles = {
    protection: "الحماية",
    crash: "إصلاح الكراش",
    related: "Related",
    all: "كل الدوال"
  };

  $("listTitle").textContent = titles[currentMode];
  $("listCount").textContent = items.length;

  if (!items.length) {
    $("list").innerHTML = `
      <div class="empty">
        لا توجد نتائج.
      </div>
    `;
    return;
  }

  $("list").innerHTML = items.map((item, index) => {
    const isSelected =
      selected &&
      Number(selected.rva) === Number(item.rva)
        ? "selected"
        : "";

    const tier = item.tier_ar || item.tier || "غير مصنف";
    const category = item.primary_category || "other";

    return `
      <div class="item ${isSelected}" data-index="${index}">
        <div class="item-name">
          ${escapeHtml(item.name || ("sub_" + hex(item.rva)))}
        </div>

        <div class="item-sub">
          RVA:
          ${escapeHtml(item.rva_fmt || hex(item.rva))}
          |
          size=${escapeHtml(item.size ?? "-")}
        </div>

        <span class="badge ${tierClass(item.tier)}">
          ${escapeHtml(tier)}
        </span>

        <span class="badge green">
          confidence=${escapeHtml(score(item))}%
        </span>

        <span class="badge blue">
          ${escapeHtml(category)}
        </span>

        <div class="item-sub">
          score=${escapeHtml(item.score ?? "-")}
          |
          crash=${escapeHtml(item.crash_score ?? "-")}
        </div>
      </div>
    `;
  }).join("");

  document.querySelectorAll(".item").forEach(element => {
    element.addEventListener("click", () => {
      selected = visibleItems[
        Number(element.dataset.index)
      ];

      renderAll();
    });
  });
}

function renderGraph() {
  const item = selected;

  if (!item) {
    $("graph").innerHTML = `
      <div class="empty">
        اختر دالة من القائمة.
      </div>
    `;
    return;
  }

  const callers = Array.isArray(item.callers)
    ? item.callers
    : [];

  const callees = Array.isArray(item.callees)
    ? item.callees
    : (
      Array.isArray(item.local_calls)
        ? item.local_calls
        : []
    );

  const callerNodes = callers.slice(0, 20).map(value => `
    <div class="node caller">
      ${escapeHtml(
        typeof value === "number"
          ? hex(value)
          : value
      )}
    </div>
  `).join("");

  const calleeNodes = callees.slice(0, 20).map(value => `
    <div class="node">
      ${escapeHtml(
        typeof value === "number"
          ? hex(value)
          : value
      )}
    </div>
  `).join("");

  $("graph").innerHTML = `
    <div class="graph-title">
      ${escapeHtml(item.name || hex(item.rva))}
    </div>

    <div class="graph-row">
      ${callerNodes || '<div class="empty">لا يوجد Callers</div>'}
    </div>

    <div class="graph-row">
      ${callers.length ? '<div class="arrow">↓</div>' : ""}
      <div class="node main">
        ${escapeHtml(item.name || hex(item.rva))}
        <br>
        ${escapeHtml(item.rva_fmt || hex(item.rva))}
      </div>
    </div>

    <div class="graph-row">
      ${callees.length ? '<div class="arrow">↓</div>' : ""}
      ${calleeNodes || '<div class="empty">لا يوجد Callees</div>'}
    </div>
  `;
}

function badges(values, className = "blue") {
  if (!Array.isArray(values) || !values.length) {
    return '<span class="badge purple">لا يوجد</span>';
  }

  return values.map(value => `
    <span class="badge ${className}">
      ${escapeHtml(value)}
    </span>
  `).join("");
}

function renderDetails() {
  if (!selected) {
    $("details").innerHTML = `
      <div class="empty">
        لا توجد دالة محددة.
      </div>
    `;
    return;
  }

  const item = selected;

  const imports = item.imports_called || [];
  const strings = item.strings_ref || [];
  const decoded = item.decoded_strings || [];
  const conditions = item.conditions || [];
  const constants = item.constants || [];
  const syscalls = item.syscalls || [];
  const evidence = item.evidence || [];
  const detectors = item.detectors || {};

  const activeDetectors = Object.entries(detectors)
    .filter(([, value]) => value)
    .map(([name]) => name);

  const confidence = Math.max(
    0,
    Math.min(100, score(item))
  );

  $("details").innerHTML = `
    <div class="details">

      <div class="section">
        <div class="section-title">المعلومات الأساسية</div>

        <div class="kv">
          <b>الاسم</b>
          <code>${escapeHtml(item.name || "-")}</code>

          <b>RVA</b>
          <code>${escapeHtml(item.rva_fmt || hex(item.rva))}</code>

          <b>النهاية</b>
          <code>${escapeHtml(hex(item.end || 0))}</code>

          <b>الحجم</b>
          <span>${escapeHtml(item.size ?? "-")} bytes</span>

          <b>المصدر</b>
          <span>${escapeHtml(item.source || "-")}</span>

          <b>التصنيف</b>
          <span>${escapeHtml(item.primary_category || "-")}</span>

          <b>الحقيقية</b>
          <span>${escapeHtml(item.is_real ?? "-")}</span>
        </div>
      </div>

      <div class="section">
        <div class="section-title">الدرجات</div>

        <div class="kv">
          <b>Confidence</b>
          <span>${confidence}%</span>

          <b>Protection</b>
          <span>${escapeHtml(item.score ?? "-")}</span>

          <b>Crash</b>
          <span>${escapeHtml(item.crash_score ?? "-")}</span>

          <b>Signal raw</b>
          <span>${escapeHtml(item.signal_raw ?? "-")}</span>

          <b>Context raw</b>
          <span>${escapeHtml(item.context_raw ?? "-")}</span>

          <b>Instructions</b>
          <span>${escapeHtml(item.n_insns ?? "-")}</span>

          <b>Callers</b>
          <span>${escapeHtml(item.n_callers ?? "-")}</span>

          <b>Callees</b>
          <span>${escapeHtml(item.n_callees ?? "-")}</span>
        </div>

        <div class="progress">
          <span style="width:${confidence}%"></span>
        </div>
      </div>

      <div class="section">
        <div class="section-title">سبب التحليل</div>

        <pre>${escapeHtml(
          item.confidence_reasons ||
          item.protection_confidence_reasons ||
          item.crash_confidence_reasons ||
          "لا يوجد"
        )}</pre>
      </div>

      <div class="section">
        <div class="section-title">
          Detectors (${activeDetectors.length})
        </div>

        ${badges(activeDetectors, "orange")}
      </div>

      <div class="section">
        <div class="section-title">
          Imports / APIs (${imports.length})
        </div>

        ${badges(imports, "blue")}
      </div>

      <div class="section">
        <div class="section-title">
          Strings (${strings.length})
        </div>

        ${badges(strings, "yellow")}
      </div>

      <div class="section">
        <div class="section-title">
          Decoded Strings (${decoded.length})
        </div>

        ${badges(decoded, "purple")}
      </div>

      <div class="section">
        <div class="section-title">
          Evidence (${evidence.length})
        </div>

        <div class="detail-list">
          ${
            evidence.length
              ? evidence.map(entry => `
                <div class="detail-line">
                  [+${escapeHtml(entry.weight ?? 0)}]
                  ${escapeHtml(entry.category || "")}
                  |
                  ${escapeHtml(entry.type || "")}
                  |
                  ${escapeHtml(entry.value || "")}
                </div>
              `).join("")
              : '<div class="empty">لا يوجد</div>'
          }
        </div>
      </div>

      <div class="section">
        <div class="section-title">

      </div>

      <div class="section">

  `;
}

function renderAll() {

async function initializePython() {
  try {
    setStatus("جاري تحميل Python داخل المتصفح...");

    pyodide = await loadPyodide();

    $("notice").textContent =
      "تم تحميل Python. اختر ملف SO أو ELF للتحليل.";

    setStatus("المحلل جاهز.");
  } catch (error) {
    console.error(error);

    $("notice").textContent =
      "فشل تحميل Python من CDN.";

    setStatus(
      "فشل تشغيل Pyodide: " + error.message,
      true
    );
  }
}

async function analyzeFile(file) {
  if (!pyodide) {
    throw new Error(
      "Python لم يكتمل تحميله بعد. انتظر قليلًا."
    );
  }

  const bytes = new Uint8Array(
    await file.arrayBuffer()
  );

  if (
    bytes.length < 4 ||
    bytes[0] !== 0x7f ||
    bytes[1] !== 0x45 ||
    bytes[2] !== 0x4c ||
    bytes[3] !== 0x46
  ) {
    throw new Error(
      "الملف المختار ليس ELF أو SO صالحًا."
    );
  }

  pyodide.globals.set(
    "web_binary_data",
    bytes
  );

  pyodide.globals.set(
    "web_file_name",
    file.name
  );

  const resultText = await pyodide.runPythonAsync(`
import json

try:
    import h
except Exception as import_error:
    json.dumps({
        "ok": False,
        "error": "تعذر استيراد h.py: " + str(import_error)
    }, ensure_ascii=False)
else:
    try:
        if not hasattr(h, "analyze_bytes_for_web"):
            raise Exception(
                "الدالة analyze_bytes_for_web غير موجودة داخل h.py"
            )

        result = h.analyze_bytes_for_web(
            bytes(web_binary_data),
            str(web_file_name)
        )

        result if isinstance(result, str) else json.dumps(
            result,
            ensure_ascii=False,
            default=str
        )
    except Exception as analysis_error:
        json.dumps({
            "ok": False,
            "error": str(analysis_error)
        }, ensure_ascii=False)
`);

  pyodide.globals.delete("web_binary_data");
  pyodide.globals.delete("web_file_name");

  const data = JSON.parse(resultText);

  if (data.ok === false) {
    throw new Error(data.error || "فشل التحليل.");
  }

  return data;
}

$("elfFile").addEventListener("change", async event => {
  const file = event.target.files?.[0];

  if (!file) {
    return;
  }

  try {
    setStatus(
      `جاري تحليل ${file.name}... لا تغلق الصفحة.`
    );

    const data = await analyzeFile(file);

    report = normalizeReport(data, file.name);
    selected = null;
    currentMode = "protection";

    document.querySelectorAll(".mode").forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.mode === currentMode
      );
    });

    setStatus(
      `اكتمل التحليل: ${file.name} | ` +
      `Protection=${report.protection.length} | ` +
      `Crash=${report.fix_crash.length} | ` +
      `Related=${report.related.length}`
    );

    renderAll();
  } catch (error) {
    console.error(error);

    setStatus(
      "فشل تحليل الملف: " + error.message,
      true
    );

    alert(
      "فشل التحليل:

" +
      error.message
    );
  }

  event.target.value = "";
});

$("search").addEventListener("input", renderList);

document.querySelectorAll(".mode").forEach(button => {
  button.addEventListener("click", () => {
    currentMode = button.dataset.mode;
    selected = null;

    document.querySelectorAll(".mode").forEach(other => {
      other.classList.toggle(
        "active",
        other === button
      );
    });

    renderAll();
  });
});

$("clear").addEventListener("click", () => {
  selected = null;
  renderAll();
});

initializePython();
</script>
